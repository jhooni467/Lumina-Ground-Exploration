<div id="menu" class="ov o"><i></i><i></i><i></i><i></i><i></i><h1>Lumina</h1><h2>Ground Exploration</h2><button class="mb" id="mc">Continuar</button><button class="mb" id="mn">Nueva partida</button><button class="mb" id="mo">Opciones</button><button class="mb" id="mx" style="display:none">Salir</button><em>Explora. Descubre. Brilla.</em><small>v1.00</small></div>

<script>
(()=>{
const SKY=0x1b3f4d, WALK=3.2, RUN=6.5, JUMP=7.5, GRAV=22;
let JOY_R=55,SENS=1,INVY=1,DD=1;
/* ---------- Mundo: ruido, biomas, senderos ---------- */
const hash=(x,z)=>{let h=Math.imul(x|0,374761393)^Math.imul(z|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;};
const vn=(x,z)=>{const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return hash(xi,zi)*(1-u)*(1-v)+hash(xi+1,zi)*u*(1-v)+hash(xi,zi+1)*(1-u)*v+hash(xi+1,zi+1)*u*v;};
const smooth=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);};
const WATER=-2.5,CS=50,RAD=2;
const hAt=(x,z)=>{
  const f=smooth(8,32,Math.hypot(x,z));
  let h=((vn(x*.02,z*.02)-.5)*12+(vn(x*.07+9,z*.07)-.5)*3+(vn(x*.13+5,z*.13+2)-.5)*1.1+1.5)*f;
  h-=smooth(.78,.92,vn(x*.011+40,z*.011+9))*9*f;
  h-=(1-smooth(6,17,Math.hypot(x+95,z+40)))*11;
  {const c=cell(x,z);if(kindOf(c[0],c[1])===5)h-=(1-smooth(16,38,Math.sqrt(c[2])))*10*f;}   /* lagunas del bioma acuático */
  const k=1-smooth(8,16,Math.hypot(x-176,z-P2(176)));
  const q=1-smooth(1.5,4,pd(x,z));h=h*(1-q)+Math.max(h,.4)*q;   /* los senderos nunca quedan bajo el agua */
  return h*(1-k)+1*k;
};
const FORCED={'0,0':2,'-1,0':1,'0,-1':0,'1,0':3};
const cell=(x,z)=>{
  const wx=x+(vn(x*.02,z*.02)-.5)*40,wz=z+(vn(x*.02+50,z*.02)-.5)*40,ci=Math.floor((wx+50)/100),cj=Math.floor((wz+50)/100);
  let best=1e9,bi=0,bj=0;
  for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++){
    const ax=i*100+(hash(i,j)-.5)*40,az=j*100+(hash(j,i+7)-.5)*40,d=(wx-ax)*(wx-ax)+(wz-az)*(wz-az);
    if(d<best){best=d;bi=i;bj=j;}
  }
  return [bi,bj,best];
};
const kindOf=(bi,bj)=>{const f=FORCED[bi+','+bj];if(f!==undefined)return f;const h2=hash(bi-23,bj+41);return h2<.2?4:h2<.38?5:Math.floor(hash(bi+11,bj-5)*4)%4;};
const biomeAt=(x,z)=>{const c=cell(x,z);return kindOf(c[0],c[1]);};
const P1=z=>22*Math.sin(z*.018)+8*Math.sin(z*.05);          /* sendero principal (norte-sur) */
const P2=x=>70+14*Math.sin(x*.03);                           /* sendero escondido (hacia el este) */
const pd=(x,z)=>Math.min(Math.abs(x-P1(z))/2.4,(x>18&&x<178)?Math.abs(z-P2(x))/1.2:9);
const POIS=[{x:176,z:P2(176),n:'Claro secreto',t:'ring'},{x:-95,z:-52,n:'Cascada',t:'falls'}];
const BIO=[
 {n:'Bosque verde',g:[.25,.5,.33],t:[1,1,1],m:{tree:12,treeF:8,treeC:8,redwood:9,willow:3,bush:14,flower:5,flower2:3,flower3:2,fern:10,rock:6,grass:40}},
 {n:'Bosque azulado',g:[.52,.45,.26],t:[.35,.75,1.9],m:{tree:4,treeF:12,treeC:4,redwood:6,willow:6,crystal:12,arch:1.5,glowP:28,sm:20,fern:8,rock:5}},
 {n:'Bosque florido',g:[.28,.55,.4],t:[1.1,1.15,.9],m:{flower:30,flower2:20,flower3:16,tree:10,treeF:10,treeC:3,blossom:16,willow:4,redwood:4,bush:10,fern:8,rock:5,grass:16}},
 {n:'Hongos gigantes',g:[.2,.5,.34],t:[1,1,1],m:{mush:5,mush2:5,mush3:4,treeF:2,redwood:2,sm:28,flower:12,flower2:7,flower3:6,fern:6,rock:5,grass:30}},
 {n:'Cavernas luminosas',g:[.74,.28,.2],t:[.55,.5,.8],m:{crystal:16,mush2:7,mush3:7,sm:24,glowP:22,rock:16,arch:3,fern:4}},
 {n:'Lagunas de coral',g:[.5,.45,.38],t:[.4,.95,.9],m:{willow:5,crystal:8,glowP:20,sm:14,fern:10,flower3:12,mush3:4,rock:6,grass:8}}
];
const FL=[0xff6f91,0xffd166,0xb388ff,0xffffff,0xff5d8f,0x7fa0ff],GL=[0x7ff0ff,0xaaffc8,0xd9a6ff,0xfff29b,0xff8fd0];
const lerpAngle=(b,a,t)=>{const d=((a-b+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return b+d*t;};
const SOFT=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.4)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();
/* tamaños: la mayoría inmensos, con algunos medianos y pequeños */
const bigS=(a,b,c)=>r=>{const u=r(),p=u<.12?a:u<.38?b:c;return p[0]+r()*(p[1]-p[0]);};
const szT=bigS([1.2,2.4],[2.4,4.4],[4.4,9]),szM=bigS([1.5,2.6],[2.6,4.5],[4.5,8]),szR=bigS([2,3],[3,4.5],[4.5,7]);
const BS={tree:szT,treeF:szT,treeC:szT,willow:szT,blossom:szT,crystal:szT,redwood:szR,mush:szM,mush2:szM,mush3:szM};

/* ---------- Renderer / Scene ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
const scene=new THREE.Scene();
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,30,105);
const hemi=new THREE.HemisphereLight(0xbfe9ff,0x1d3b2f,.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d0,.7);sun.position.set(30,50,20);scene.add(sun,sun.target);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.001;sun.shadow.normalBias=.4;
{const sc=sun.shadow.camera;sc.left=sc.bottom=-48;sc.right=sc.top=48;sc.near=1;sc.far=170;}
const camera=new THREE.PerspectiveCamera(65,1,.1,145);

/* ---------- Input (touch / mouse / keyboard) ---------- */
const Input={pt:new Map(),pd:0,move:{x:0,y:0},keys:{},jump:false,act:false,yaw:0,pitch:.3,joyId:null,lookId:null,ox:0,oy:0,lx:0,ly:0};
const pinchD=()=>{const a=[...Input.pt.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);};
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
const joyHome=()=>{joy.style.left='28px';joy.style.top='';joy.style.bottom='calc(48px + env(safe-area-inset-bottom,0px))';knob.style.transform='';};
window.addEventListener('pointerdown',e=>{
  if(e.clientX<innerWidth*.5&&e.clientY>innerHeight*.45&&Input.joyId===null){
    Input.joyId=e.pointerId;Input.ox=e.clientX;Input.oy=e.clientY;
    const hw=joy.offsetWidth/2;joy.style.left=(e.clientX-hw)+'px';joy.style.top=(e.clientY-hw)+'px';joy.style.bottom='auto';
  }else{Input.pt.set(e.pointerId,[e.clientX,e.clientY]);if(Input.lookId===null){Input.lookId=e.pointerId;Input.lx=e.clientX;Input.ly=e.clientY;}if(Input.pt.size===2)Input.pd=pinchD();}
});
window.addEventListener('pointermove',e=>{
  if(Input.pt.has(e.pointerId)){Input.pt.set(e.pointerId,[e.clientX,e.clientY]);if(Input.pt.size>=2){const d=pinchD();CameraRig.dist=Math.min(14,Math.max(3.5,CameraRig.dist-Math.min(.35,Math.max(-.35,(d-Input.pd)*.03))));Input.pd=d;Input.lx=e.clientX;Input.ly=e.clientY;return;}}
  if(e.pointerId===Input.joyId){
    let dx=e.clientX-Input.ox,dy=e.clientY-Input.oy;const m=Math.hypot(dx,dy);
    if(m>JOY_R){dx*=JOY_R/m;dy*=JOY_R/m;}
    knob.style.transform=`translate(${dx}px,${dy}px)`;Input.move.x=dx/JOY_R;Input.move.y=dy/JOY_R;
  }else if(e.pointerId===Input.lookId){
    Input.yaw-=(e.clientX-Input.lx)/innerWidth*3.2*SENS;
    Input.pitch=Math.min(1.25,Math.max(-.55,Input.pitch+(e.clientY-Input.ly)/innerHeight*2.4*SENS*INVY));
    Input.lx=e.clientX;Input.ly=e.clientY;
  }
});
const release=e=>{
  if(e.pointerId===Input.joyId){Input.joyId=null;Input.move.x=Input.move.y=0;joyHome();}
  Input.pt.delete(e.pointerId);if(e.pointerId===Input.lookId){Input.lookId=null;const n=Input.pt.entries().next().value;if(n){Input.lookId=n[0];Input.lx=n[1][0];Input.ly=n[1][1];}}else if(Input.lookId!==null&&Input.pt.has(Input.lookId)){const v=Input.pt.get(Input.lookId);Input.lx=v[0];Input.ly=v[1];}
};
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
const resetInput=()=>{Input.pt.clear();Input.joyId=Input.lookId=null;Input.move.x=Input.move.y=0;Input.keys={};joyHome();};
window.addEventListener('blur',resetInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)resetInput();});
window.addEventListener('keydown',e=>{Input.keys[e.code]=true;if(e.code==='Space')Input.jump=true;if(e.code==='KeyE'){Input.act=true;Interact.unlock();}if(e.code==='KeyG')Glow.toggle();});
document.getElementById('bj').addEventListener('pointerdown',e=>{e.stopPropagation();Input.jump=true;});
document.getElementById('bi').addEventListener('pointerdown',e=>{e.stopPropagation();Input.act=true;Interact.unlock();});
document.getElementById('bg').addEventListener('pointerdown',e=>{e.stopPropagation();Glow.toggle();});
window.addEventListener('keyup',e=>Input.keys[e.code]=false);
window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('wheel',e=>{CameraRig.dist=Math.min(14,Math.max(3.5,CameraRig.dist+Math.sign(e.deltaY)*.6));},{passive:true});

/* ---------- World: chunks con carga progresiva ---------- */
const jit=(g,a)=>{const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),h=q=>{const v=Math.sin((x*12.9898+y*78.233+z*37.719+q)*43758.5453);return v-Math.floor(v)-.5;};p.setXYZ(i,x+h(1)*a,y+h(2)*a,z+h(3)*a);}return g;};
const merge=parts=>{const pos=[],nor=[],col=[],c=new THREE.Color(),c2=new THREE.Color();

  tap(px,py){const P=Player.pos,v=new B.Vector3();let best=null,bd=46;for(const e of this.E){if(e.k!=='npc'||!e.g.visible||!e.talk||Math.hypot(e.x-P.x,e.z-P.z)>14)continue;v.set(e.x,e.g.position.y+1.9,e.z).project(camera);if(v.z>1)continue;const d=Math.hypot((v.x*.5+.5)*innerWidth-px,(-v.y*.5+.5)*innerHeight-py);if(d<bd){bd=d;best=e;}}if(best)this.talk(best);}};})();
let TAPD=null;window.addEventListener('pointerdown',e=>{TAPD={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now()};});
window.addEventListener('pointerup',e=>{if(TAPD&&TAPD.id===e.pointerId&&!UI.paused&&Math.hypot(e.clientX-TAPD.x,e.clientY-TAPD.y)<12&&performance.now()-TAPD.t<400)Folk.tap(e.clientX,e.clientY);TAPD=null;});
/* ---------- UI: menú, ajustes, guardado, minimapa, mochila ---------- */
const UI=(()=>{const $=id=>document.getElementById(id),SV='lumina-save',ST='lumina-set',BC=['#3f8a52','#3a6fb0','#e08fb5','#8a5fd0','#5a3fa0','#2fb5b0','#1d5f80'];
 const AND=/Android/i.test(navigator.userAgent),D={vol:80,amb:70,sfx:100,q:AND?1:2,dd:AND?90:100,sh:AND?1:2,fx:1,sens:100,bs:100,inv:0};let cf={};try{cf=Object.assign({},D,JSON.parse(localStorage.getItem(ST)||'{}'));}catch(e){cf=Object.assign({},D);}
 const U={paused:true,fx:1,started:false,mt:0,st:0,sv:0,ex:new Map(),bag:{},cap:24,
  CAT:{luz:['Luz','✨'],llave:['Llave','🗝️'],cristal:['Cristal','💎'],hongo:['Hongo','🍄'],flor:['Flor','🌸'],fibra:['Fibra','🌿'],piedra:['Piedra','🪨']},
  add(id,n){n=n||1;const b=this.bag;if(b[id]===undefined){if(Object.keys(b).length>=this.cap){Interact.say('Mochila llena');return 0;}b[id]=0;}b[id]=Math.min(99,b[id]+n);return n;},
  save(){try{localStorage.setItem(SV,JSON.stringify({x:Player.pos.x,z:Player.pos.z,yaw:Input.yaw,bag:this.bag,ex:[...this.ex],tk:[...Settle.taken]}));}catch(e){}},
  load(){try{const d=JSON.parse(localStorage.getItem(SV)||'null');if(!d)return false;Player.pos.set(d.x,hAt(d.x,d.z),d.z);Input.yaw=d.yaw||0;this.bag=d.bag||{};this.ex=new Map(d.ex||[]);Settle.taken=new Set(d.tk||[]);return true;}catch(e){return false;}},
  aud(){const I=Interact;if(!I.mg)return;const t=I.ac.currentTime;I.mg.gain.setTargetAtTime(U.paused?0:cf.vol/100,t,.1);I.am.gain.setTargetAtTime(cf.amb/100,t,.1);I.sg.gain.setTargetAtTime(cf.sfx/100,t,.1);},
  apply(){SENS=cf.sens/100;INVY=cf.inv?-1:1;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,[.75,1.1,1.75][cf.q]));resize();
   const f=cf.dd/100;camera.far=145*f;camera.updateProjectionMatrix();DD=f;
   sun.castShadow=cf.sh>0;if(cf.sh>0){const n=cf.sh>1?2048:1024;if(sun.shadow.mapSize.x!==n){if(sun.shadow.map)sun.shadow.map.dispose();sun.shadow.map=null;sun.shadow.mapSize.set(n,n);}}
   U.fx=cf.fx;renderer.toneMapping=cf.fx?THREE.ACESFilmicToneMapping:THREE.NoToneMapping;document.documentElement.style.setProperty('--bs',cf.bs/100);U.aud();
   try{localStorage.setItem(ST,JSON.stringify(cf));}catch(e){}},
  col(x,z){return hAt(x,z)<WATER?BC[6]:BC[biomeAt(x,z)];},
  mark(){const P=Player.pos,ci=Math.floor(P.x/16),cj=Math.floor(P.z/16);for(let i=ci-3;i<=ci+3;i++)for(let j=cj-3;j<=cj+3;j++){const x=i*16+8,z=j*16+8;if(Math.hypot(x-P.x,z-P.z)<52){const k=i+','+j;if(!this.ex.has(k))this.ex.set(k,hAt(x,z)<WATER?6:biomeAt(x,z));}}},
  mini(){const c=$('mini').getContext('2d'),P=Player.pos,v=new THREE.Vector3();camera.getWorldDirection(v);const a=Math.atan2(v.x,-v.z);c.clearRect(0,0,100,100);c.save();c.translate(50,50);c.rotate(-a);
   for(let i=-18;i<=18;i++)for(let j=-18;j<=18;j++){if(i*i+j*j>330)continue;c.fillStyle=this.col(P.x+i*3,P.z+j*3);c.fillRect(i*3-1.5,j*3-1.5,3.2,3.2);}c.restore();
   c.font='bold 11px system-ui';c.fillStyle='#fff';c.textAlign='center';c.fillText('N',50-Math.sin(a)*41,54-Math.cos(a)*41);c.font='17px serif';c.fillText('🍄',50,57);},
  big(){const c=$('mapc').getContext('2d'),P=Player.pos;c.fillStyle='#0a0620';c.fillRect(0,0,300,300);for(const[k,b]of this.ex){const[i,j]=k.split(',');c.fillStyle=BC[b];c.fillRect(i*16-P.x+150,j*16-P.z+150,16.5,16.5);}c.fillStyle='#fff';c.font='bold 13px system-ui';c.textAlign='center';c.fillText('N',150,14);c.font='20px serif';c.fillText('🍄',150,157);},
  tick(dt){this.mt+=dt;this.st+=dt;this.sv+=dt;if(this.mt>.25){this.mt=0;this.mini();if($('mapx').classList.contains('o'))this.big();}if(this.st>.5){this.st=0;this.mark();}if(this.sv>5){this.sv=0;this.save();}},
  show(id,on){$(id).classList.toggle('o',on);},
  menu(){this.paused=true;this.save();Interact.unlock();$('mc').textContent=this.started?'Reanudar':'Continuar';$('mc').disabled=!this.started&&!localStorage.getItem(SV);this.show('menu',true);this.aud();},
  play(){this.paused=false;this.started=true;['menu','set','mapx','bagp'].forEach(i=>this.show(i,false));Interact.unlock();this.aud();},
  bagUi(){const S=Interact.S,e=Object.assign({},this.bag);if(S.luz)e.luz=S.luz;if(S.llave)e.llave=1;if(S.cofre)e.cristal=(e.cristal||0)+1;$('bagn').textContent=Object.keys(e).length+'/'+this.cap;
   $('bagg').innerHTML=Object.keys(e).map(k=>{const q=this.CAT[k]||[k,'📦'];return '<div><b>'+q[1]+'</b>'+q[0]+' ×'+e[k]+'</div>';}).join('')||'<p style="grid-column:1/5;opacity:.7;text-align:center">Vacía. Explora para encontrar recursos.</p>';},
  setUi(){const sl=(k,l,a,b)=>'<div class="row">'+l+'<input type="range" min="'+a+'" max="'+b+'" value="'+cf[k]+'" data-k="'+k+'"></div>',op=(k,l,o)=>'<div class="row">'+l+'<button data-o="'+k+'">'+o[cf[k]]+'</button></div>',on=['No','Sí'];
   $('set').innerHTML='<h3>Audio</h3>'+sl('vol','Volumen general',0,100)+sl('amb','Música ambiental',0,100)+sl('sfx','Efectos de sonido',0,100)+'<h3>Gráficos</h3>'+op('q','Calidad gráfica',['Baja','Media','Alta'])+sl('dd','Distancia de dibujado',50,100)+op('sh','Sombras',['Apagadas','Medias','Altas'])+op('fx','Efectos visuales',on)+'<h3>Controles</h3>'+sl('sens','Sensibilidad',50,200)+sl('bs','Tamaño de botones táctiles',80,130)+op('inv','Invertir cámara vertical',on)+'<h3>Otros</h3><div class="row">Idioma<span>Español</span></div><button class="mb" id="sr">Restablecer</button><button class="mb" id="sk">Guardar y volver</button>';
   $('set').querySelectorAll('input').forEach(i=>i.oninput=()=>{cf[i.dataset.k]=+i.value;U.apply();});
   $('set').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const k=b.dataset.o;cf[k]=(cf[k]+1)%(k==='q'||k==='sh'?3:2);U.apply();U.setUi();});
   $('sr').onclick=()=>{cf=Object.assign({},D);U.apply();U.setUi();};$('sk').onclick=()=>{U.apply();U.show('set',false);};}};
 ['menu','set','mapx','bagp','mini','bb','bm'].forEach(i=>$(i).addEventListener('pointerdown',e=>e.stopPropagation()));
 $('mc').onclick=()=>{if(!U.started&&!U.load())return;U.play();};
 $('mn').onclick=()=>{if(localStorage.getItem(SV)&&!confirm('¿Empezar una partida nueva? Se perderá el progreso guardado.'))return;localStorage.removeItem(SV);U.bag={};U.ex=new Map();Settle.reset();Player.pos.set(0,hAt(0,0),0);Player.vel.set(0,0,0);Input.yaw=0;U.play();};
 $('mo').onclick=()=>{U.setUi();U.show('set',true);};
 $('mapk').onclick=()=>U.show('mapx',false);$('bagk').onclick=()=>U.show('bagp',false);
 $('mini').onclick=()=>{U.big();U.show('mapx',true);};$('bb').onclick=()=>{U.bagUi();U.show('bagp',true);};$('bm').onclick=()=>U.menu();
 if(/Android/i.test(navigator.userAgent)){$('mx').style.display='';$('mx').onclick=()=>{U.save();const C=window.Capacitor;C&&C.Plugins&&C.Plugins.App?C.Plugins.App.exitApp():window.close();};}
 window.addEventListener('pagehide',()=>U.save());document.addEventListener('visibilitychange',()=>{if(document.hidden&&U.started)U.save();});
 window.__aud=U.aud;window.LuminaBag=U;try{const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(A){A.addListener('backButton',()=>{if(U.paused){if(U.started)U.play();}else U.menu();});A.addListener('pause',()=>U.save());}}catch(e){}U.menu();U.apply();return U;})();
let last=performance.now(),fa=0,fn=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(landscape||UI.paused)return;
  Player.update(dt);CameraRig.update(dt);World.update(dt);Sky.update(dt);Interact.update(dt);Glow.update(dt);Wardrobe.update(dt);Fauna.update(dt);UI.fx&&Leaves.update(dt);Amb.update(dt);UI.tick(dt);Settle.upd();Folk.upd(dt);renderer.render(scene,camera);
  fa+=dt;fn++;if(fa>.5){fpsEl.textContent=Math.round(fn/fa)+' FPS · '+Player.state;fa=0;fn=0;}
}
requestAnimationFrame(loop);
})();
