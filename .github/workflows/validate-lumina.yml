name: Validate Lumina game script

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "build-android.sh"
      - "LEEME_ANDROID.md"
      - ".github/workflows/validate-lumina.yml"
  pull_request:
    paths:
      - "index.html"
      - "build-android.sh"
      - "LEEME_ANDROID.md"
      - ".github/workflows/validate-lumina.yml"

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract inline game script
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(
              r"<script\\b(?![^>]*\\bsrc\\s*=)[^>]*>(.*?)</script\\s*>",
              html,
              flags=re.IGNORECASE | re.DOTALL,
          )
          if len(scripts) != 1:
              raise SystemExit(
                  f"Expected exactly one inline script; found {len(scripts)}."
              )
          Path("/tmp/lumina-game.js").write_text(scripts[0], encoding="utf-8")
          print("Extracted the inline game script.")
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/lumina-game.js
      - name: Check Android build script syntax
        run: bash -n build-android.sh
